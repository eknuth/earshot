name: Release

# Manual only. Releases are cut by hand per PUBLISHING.md so the XCFramework zip that lands on
# the GitHub release is the exact one whose checksum is pinned in Package.swift (a CI rebuild can
# differ byte-for-byte and break SPM validation). Trigger this from the Actions tab with the
# version input to rebuild + re-attach artifacts; it does not publish to Maven Central.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v), e.g. 0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from input
        run: echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Build release AAR
        run: ./gradlew :earshot:assembleRelease -Pearshot.version="$VERSION" --stacktrace

      - name: Build iOS XCFramework
        run: ./gradlew :earshot:assembleEarshotReleaseXCFramework -Pearshot.version="$VERSION" --stacktrace

      - name: Package + checksum XCFramework
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            earshot/build/XCFrameworks/release/Earshot.xcframework \
            Earshot.xcframework.zip
          # compute-checksum needs to run inside the Swift package (repo root has Package.swift).
          CHECKSUM=$(swift package compute-checksum Earshot.xcframework.zip)
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Verify Package.swift matches the built XCFramework
        run: |
          if ! grep -q "$CHECKSUM" Package.swift; then
            echo "::error::Package.swift checksum does not match the XCFramework built for v$VERSION."
            echo "Built checksum: $CHECKSUM"
            echo "A CI rebuild can differ from the local build; the release must carry the locally pinned zip. See PUBLISHING.md."
            exit 1
          fi
          if ! grep -q "releases/download/v$VERSION/Earshot.xcframework.zip" Package.swift; then
            echo "::error::Package.swift binaryTarget url does not point at v$VERSION."
            exit 1
          fi

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          cp earshot/build/outputs/aar/*-release.aar release-artifacts/ || true
          cp Earshot.xcframework.zip release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          generate_release_notes: true
          files: release-artifacts/*
