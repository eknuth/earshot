name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Gradle wrapper validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build library and sample, run unit tests
        run: ./gradlew :earshot:assemble :earshot:testDebugUnitTest :sample-android:assembleDebug --stacktrace

      - name: Upload sample APK
        uses: actions/upload-artifact@v7
        with:
          name: sample-android-debug
          path: sample-android/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS framework build
    runs-on: macos-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin iOS framework
        run: ./gradlew :earshot:linkDebugFrameworkIosSimulatorArm64 --stacktrace
