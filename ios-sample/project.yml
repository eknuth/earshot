name: EarshotSample
options:
  bundleIdPrefix: dev.eknuth.earshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# On-device ASR runtime. WhisperKit (CoreML) is wired in through
# WhisperKitTranscriptionProvider, which registers itself with the shared
# NativeTranscriptionProviderHolder at launch.
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"

settings:
  base:
    # The KMP embed task writes Earshot.framework here, keyed by configuration + sdk.
    FRAMEWORK_SEARCH_PATHS:
      - $(SRCROOT)/../earshot/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    # Earshot is a static framework; nothing to embed or sign, just link.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  EarshotSample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # The reference WhisperKit glue lives at the repo root and is shared with the docs.
      - path: ../ios-support
      # Benchmark fixtures (LibriSpeech clips + manifest). Folder reference so the
      # fixtures/ structure is preserved in the app bundle. Used only by --earshot-bench.
      - path: fixtures
        type: folder
      # Parakeet-TDT model files (encoder/decoder/joiner + tokens) for sherpa-onnx.
      # Folder reference named "parakeet"; used only by --earshot-bench-parakeet. Not in git.
      - path: parakeet
        type: folder
      # Nemotron-Speech-Streaming model files (encoder/decoder/joiner + tokens) for sherpa-onnx.
      # Folder reference named "nemotron"; used only by --earshot-bench-nemotron. Not in git.
      - path: nemotron
        type: folder
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # On-device models + standard HTTPS only, so the app qualifies for the
        # encryption exemption.
        ITSAppUsesNonExemptEncryption: false
        # Used only by the --earshot-bench-apple accuracy comparison against Apple's
        # on-device recognizer; the normal demo does not use speech recognition.
        NSSpeechRecognitionUsageDescription: "Earshot benchmarks Apple's on-device speech recognizer against WhisperKit on the same clips."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.eknuth.earshot.sample
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XK3FY8QSZ7
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # sherpa-onnx C API is reached through a bridging header (it has no Swift module).
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/Sources/EarshotSample-Bridging-Header.h
    dependencies:
      # Link the KMP framework produced by the pre-build run script below.
      - framework: Earshot.framework
        embed: false
        link: true
        implicit: true
      - package: WhisperKit
        product: WhisperKit
      # sherpa-onnx runtime for the Parakeet benchmark: static-lib xcframeworks, linked not
      # embedded. Xcode adds each xcframework's slice Headers dir to the header search path,
      # so the bridging header's #import "sherpa-onnx/c-api/c-api.h" resolves.
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
        link: true
      - framework: Vendor/onnxruntime.xcframework
        embed: false
        link: true
    preBuildScripts:
      - name: "Build + embed the Earshot KMP framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.." && \
          JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home \
          ./gradlew :earshot:embedAndSignAppleFrameworkForXcode
