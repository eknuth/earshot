          - strong [ref=e228]: "One caveat worth stating:"
          - text: the checkpoint you benchmark in a lab and the quantized build that actually runs on the phone are not identical. So the number that counts is the one you get from scoring the on-device model on a real device. Measure where the software runs, not where it is convenient.
