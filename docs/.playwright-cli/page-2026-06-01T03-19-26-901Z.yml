          - text: by Argmax. On Android the model is a Microsoft Olive export of Whisper running on ONNX Runtime.
        - paragraph [ref=e241]: "Earshot is the part around the model: getting it onto the device, extracting clean 16kHz audio from whatever file you started with, running the model inside a phone's memory and battery budget, and exposing one API that behaves the same on both platforms. That integration layer is the hard, unglamorous part of shipping a model onto someone's phone, and it is the part this library is about."
