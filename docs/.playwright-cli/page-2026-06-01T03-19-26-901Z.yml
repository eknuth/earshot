        - paragraph [ref=e238]:
          - text: I did not train a speech model.
          - strong [ref=e239]: Whisper is OpenAI's.
          - text: On iOS the Whisper runtime is
          - link "WhisperKit" [ref=e240] [cursor=pointer]:
