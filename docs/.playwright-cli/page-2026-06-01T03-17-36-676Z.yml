        - paragraph [ref=e243]:
          - text: I did not train a speech model.
          - strong [ref=e244]: Whisper is OpenAI's.
          - text: On iOS the Whisper runtime is
          - link "WhisperKit" [ref=e245] [cursor=pointer]:
